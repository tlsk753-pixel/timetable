<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d6a56">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>학교 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 배치: 위쪽 고정 머리줄(이름·날짜·교사 찾기) + 가로로 넘기는 메뉴 + 본문 한 단. 표는 각자 가로 스크롤 */
  --bg: #f2f4ef; --panel: #ffffff; --ink: #1b2a26; --muted: #5f6f69; --line: #d5dcd4;
  --accent: #1d6a56; --accent-ink: #ffffff; --accent-soft: #e0efe9;
  --swap: #a85d08; --swap-bg: #fdeed3; --cover: #3553b4; --cover-bg: #e3e9fb;
  --bad: #bd362d; --bad-bg: #fbe1de; --ok: #1c7a4c; --ok-bg: #dff3e7; --warn-bg: #fff3c9;
  --tint-s: 55%; --tint-l: 94%;
  --font-display: 'Do Hyeon', 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131917; --panel: #1b2320; --ink: #e5ece8; --muted: #98a7a0; --line: #2f3b36;
    --accent: #62c6a6; --accent-ink: #0c1915; --accent-soft: #1f342d;
    --swap: #eaa650; --swap-bg: #3a2b12; --cover: #93a9f0; --cover-bg: #1f2947;
    --bad: #f08379; --bad-bg: #3d1e1b; --ok: #6fd19b; --ok-bg: #173324; --warn-bg: #3a3413;
    --tint-s: 28%; --tint-l: 21%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131917; --panel: #1b2320; --ink: #e5ece8; --muted: #98a7a0; --line: #2f3b36;
  --accent: #62c6a6; --accent-ink: #0c1915; --accent-soft: #1f342d;
  --swap: #eaa650; --swap-bg: #3a2b12; --cover: #93a9f0; --cover-bg: #1f2947;
  --bad: #f08379; --bad-bg: #3d1e1b; --ok: #6fd19b; --ok-bg: #173324; --warn-bg: #3a3413;
  --tint-s: 28%; --tint-l: 21%;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 24px; } h3 { font-size: 18px; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px 6px; }
.brand { font-family: var(--font-display); font-size: 22px; margin-right: auto; display: flex; align-items: baseline; gap: 8px; }
.brand small { font: 13px var(--font-body); color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 12px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; padding: 8px 12px; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--accent); border-color: var(--accent); font-weight: 600; }
nav.tabs a.adm { color: var(--swap); }
main { padding: 16px; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.spread { justify-content: space-between; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 3px 8px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="date"], input[type="text"], input[type="number"], select, textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 8px; }
input[type="number"] { width: 64px; }
textarea { width: 100%; min-height: 110px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.f > * { color: var(--ink); font-size: 15px; }
label.ck { display: inline-flex; align-items: center; gap: 6px; }

.pill { display: inline-block; border-radius: 99px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.swap { background: var(--swap-bg); color: var(--swap); } .pill.cover { background: var(--cover-bg); color: var(--cover); }
.pill.gray { background: var(--bg); color: var(--muted); }
.note { background: var(--warn-bg); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.note.info { background: var(--accent-soft); }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table.tt { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; line-height: 1.25; }
table.tt th, table.tt td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 5px; text-align: center; }
table.tt th { background: var(--bg); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
table.tt th.side, table.tt td.side { position: sticky; left: 0; background: var(--bg); z-index: 2; min-width: 34px; font-weight: 600; }
table.tt tr.gap td, table.tt tr.gap th { border-top: 3px solid var(--line); }
table.tt th.g2, table.tt td.g2 { border-left: 3px solid var(--line); }
td.c { min-width: 62px; height: 46px; background: var(--panel); cursor: pointer; position: relative; }
td.c b { display: block; font-weight: 600; font-size: 14px; } td.c span { display: block; color: var(--ink); opacity: .75; font-size: 12.5px; }
table.tt.daily td.side, table.tt.daily th { font-size: 14px; }
table.tt.daily tbody tr:nth-child(even) td.c:not([class*="m-"]) { background-color: var(--bg); }
table.tt.roomy { table-layout: fixed; } table.tt.roomy th.side, table.tt.roomy td.side { width: 40px; }
table.tt.roomy td.c { min-width: 0; height: 62px; } table.tt.roomy td.c b { font-size: 17px; } table.tt.roomy td.c span { font-size: 14.5px; opacity: .8; } table.tt.roomy th { font-size: 15px; padding: 7px 4px; }
td.c.mine { box-shadow: inset 0 0 0 3px var(--accent); }
.foot { display: flex; justify-content: center; padding: 24px 0 8px; } .linkbtn { background: none; border: 0; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; padding: 8px; }
td.c.empty { background: var(--panel); cursor: default; }
td.c.wide { min-width: 96px; height: 50px; }
td.c.m-교 { background: var(--swap-bg); box-shadow: inset 0 0 0 2px var(--swap); }
td.c.m-보, td.c.m-변 { background: var(--cover-bg); box-shadow: inset 0 0 0 2px var(--cover); }
td.c.m-시 { background: var(--warn-bg); box-shadow: inset 0 0 0 2px var(--line); }
td.hitcell { box-shadow: inset 0 0 0 3px var(--accent); }
td.c .mk { position: absolute; top: 1px; right: 3px; font-size: 10px; font-weight: 700; color: var(--swap); }
td.c.m-보 .mk, td.c.m-변 .mk { color: var(--cover); }
td.c.m-시 .mk { color: var(--muted); }
td.c.clash { background: var(--bad-bg); box-shadow: inset 0 0 0 2px var(--bad); }
td.c.dup { box-shadow: inset 0 0 0 2px var(--swap); }
td.c.moved { box-shadow: inset 0 0 0 2px var(--cover); }
td.c.pick { box-shadow: inset 0 0 0 3px var(--accent); }
td.c.hit { box-shadow: inset 0 0 0 3px var(--accent); }
table.tt.finding td.c:not(.hit) { opacity: .35; }
td.c.today-col { outline: 0; }
th.now { color: var(--accent); }

.cand td { cursor: pointer; height: 38px; min-width: 70px; }
.cand td.s-ok { background: var(--ok-bg); } .cand td.s-warn { background: var(--warn-bg); } .cand td.s-no { background: transparent; color: var(--muted); opacity: .6; }
.cand td.s-self { background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: default; }
.cand td.s-self span { color: inherit; }
.cand td.sel { box-shadow: inset 0 0 0 3px var(--accent); opacity: 1; }
.plist { display: flex; flex-wrap: wrap; gap: 6px; }
.plist .btn { text-align: left; line-height: 1.25; padding: 5px 10px; }
.plist .btn span { display: block; font-size: 12px; color: var(--muted); }
ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
ul.plain li { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
ul.plain li:last-child { border: 0; padding: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
table.list { border-collapse: collapse; width: 100%; font-size: 14px; }
table.list th, table.list td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; white-space: nowrap; }
table.list th { color: var(--muted); font-weight: 600; font-size: 13px; }
table.list td.r, table.list th.r { text-align: right; font-variant-numeric: tabular-nums; }
.offgrid td { cursor: pointer; height: 30px; min-width: 44px; } .offgrid td.x { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.bar2 { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; } .bar2 i { display: block; height: 100%; background: var(--accent); }

#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; z-index: 60; display: none; max-width: 90vw; }
#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
#modal .box { background: var(--panel); border-radius: 12px; padding: 18px; width: min(520px, 100%); max-height: 90%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 520px) { .bar { padding: 8px 12px 4px; } main { padding: 12px; } h2 { font-size: 21px; } }
@media print {
  header.top nav, .noprint, #toast { display: none !important; }
  header.top { position: static; border: 0; } body { background: #fff; } main { padding: 0; max-width: none; }
  .scroll { overflow: visible; border: 0; } table.tt { font-size: 10px; } td.c { min-width: 0; height: auto; }
}
@media (prefers-reduced-motion: no-preference) { .btn, nav.tabs a { transition: border-color .15s, background .15s; } }

.mealgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: start; }
.mealgrid .panel.nowday { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
ul.dishes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 15px; }

.foot { align-items: center; gap: 12px; } .ver { color: var(--muted); font-size: 11px; }

</style>
</head>

  const HUES = [[/국어/, 355], [/수학/, 215], [/영어/, 275], [/과학/, 150], [/사회|역사|도덕/, 32], [/체육|스포/, 190], [/음악|미술/, 320], [/기가|기술|가정|정보/, 85]];
  const hue = s => { const f = HUES.find(([re]) => re.test(s)); return f ? f[1] : '0;--ts:0%'; };
  const grade = c => c.split('-')[0];
  const gcls = (c, i) => (i > 0 && grade(c) !== grade(data.classes[i - 1]) ? ' g2' : '');
  function cell(l, a = '', cl = '') {
    if (!l) return `<td class="c empty ${cl}" ${a}></td>`;
    const hit = ui.find ? (C.teachersOf(l).includes(ui.find) ? ' hit' : '') : (level() >= 1 && ui.sw.teacher && C.teachersOf(l).includes(ui.sw.teacher) ? ' mine' : '');
    return `<td class="c ${cl}${l.mark ? ' m-' + l.mark : ''}${hit}" style="--h:${hue(l.s)}" ${a}>${l.mark ? `<i class="mk">${l.mark === '시' ? '고사' : l.mark}</i>` : ''}${pairs(l).map(([s, t]) => `<b>${esc(s)}</b><span>${esc(t)}</span>`).join('')}</td>`;
  }
  /** 분반·이동수업 칸은 과목·교사 쌍으로 나눠 보여 준다 */
  const pairs = l => { const ss = l.s.split('/'), tt = l.t.split('/'); return ss.length > 1 && ss.length === tt.length ? ss.map((s, i) => [s, tt[i]]) : [[l.s, l.t]]; };
  const classHead = (list = data.classes) => {
    const gs = []; list.forEach(c => { const g = grade(c); if (gs.length && gs[gs.length - 1][0] === g) gs[gs.length - 1][1]++; else gs.push([g, 1]); });
    return `<tr><th class="side" rowspan="2">교시</th>${gs.map(([g, n], i) => `<th colspan="${n}" class="${i ? 'g2' : ''}">${g}학년</th>`).join('')}</tr><tr>${list.map(c => `<th class="${gcls(c, data.classes.indexOf(c))}">${c}</th>`).join('')}</tr>`;
  };
  const grades = () => [...new Set(data.classes.map(grade))];
  /** 일일 시간표에 보일 학년: 좁은 화면에서는 한 학년씩 */
  const gradeFilter = () => { if (ui.gf == null) ui.gf = window.innerWidth < 760 ? grades()[0] : 'all'; if (ui.gf !== 'all' && !grades().includes(ui.gf)) ui.gf = 'all'; return ui.gf; };
  const opt = (v, label, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label)}</option>`;
  const teacherOpts = cur => { const by = {}; C.allTeachers(data).forEach(t => (by[data.depts[t] || '기타'] ||= []).push(t)); return Object.keys(by).sort((a, b) => a.localeCompare(b, 'ko')).map(d => `<optgroup label="${esc(d)}">${by[d].map(t => opt(t, t, cur)).join('')}</optgroup>`).join(''); };
  const longDate = s => { const d = C.fromYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${'월화수목금토일'[C.dayIdx(s)]}요일`; };
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = 'none'), 2600); }
  function modal(html) { $('#modal .box').innerHTML = html; $('#modal').style.display = 'flex'; const f = $('#modal input, #modal textarea'); if (f) f.focus(); }
  const closeModal = () => ($('#modal').style.display = 'none');
  let onYes = null;
  function confirmBox(msg, yes, label = '확인') { onYes = yes; modal(`<p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="yes">${esc(label)}</button></div>`); }
  function copy(text, what = '내용') {
    const fallback = () => modal(`<h3>${esc(what)} 복사</h3><p class="small muted">아래 내용을 전체 선택해 복사하세요.</p><textarea id="copybox" readonly>${esc(text)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">닫기</button></div>`);
    try { navigator.clipboard.writeText(text).then(() => toast(`${what}을(를) 복사했습니다.`), fallback); } catch (e) { fallback(); }
  }
  function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click(); }
  const dateNav = (unit) => `<div class="row noprint"><button class="btn" data-act="shift" data-n="${-unit}" aria-label="이전">◀</button><input type="date" id="datepick" data-ch="date" value="${ui.date}"><button class="btn" data-act="shift" data-n="${unit}" aria-label="다음">▶</button><button class="btn" data-act="today">오늘</button></div>`;
  const weekDates = () => { const m = C.mondayOf(ui.date); return [0, 1, 2, 3, 4].map(i => C.addDays(m, i)); };

  /* ── 일일 시간표 ── */
  function vDaily() {
    const st = state(), date = ui.date, n = st.nPeriods(date);
    const ch = data.changes.filter(c => C.changeDates(c).includes(date)), memo = data.memos[date] || '', info = calInfo(date), meal = neis.meal[date];
    const me = level() >= 1 ? ui.sw.teacher : '', t0 = today(), t7 = C.addDays(t0, 7);
    const mine = me ? data.changes.filter(c => [...C.teachersOf(c.x), ...C.teachersOf(c.y), c.t].includes(me) && C.changeDates(c).some(d => d >= t0 && d <= t7)) : [];
    const gf = gradeFilter(), list = data.classes.filter(c => gf === 'all' || grade(c) === gf); let rows = '';
    for (let p = 0; p < n; p++) rows += `<tr><td class="side">${p + 1}</td>${list.map(c => cell(st.get(date, c, p), `data-act="lesson" data-cls="${c}" data-p="${p}" data-date="${date}"`, gcls(c, data.classes.indexOf(c)))).join('')}</tr>`;
    return `<div class="row spread"><h2>${longDate(date)} 일일시간표 ${info && info.label ? `<span class="pill ${info.periods === 0 ? 'bad' : 'cover'}">${esc(info.label)}</span>` : ''}</h2>${dateNav(1)}</div>
      ${mine.length ? `<div class="note noprint"><b>${esc(me)} 선생님 수업 변동 ${mine.length}건 (오늘부터 7일)</b><br>${mine.map(c => esc(C.describeChange(c))).join('<br>')}</div>` : ''}
      <div class="row spread noprint"><div class="row" role="group" aria-label="학년 고르기">${[['all', '전체'], ...grades().map(g => [g, g + '학년'])].map(([v, l]) => `<button class="btn ${gf === v ? 'on' : ''}" data-act="gf" data-g="${v}">${l}</button>`).join('')}</div>
      <div class="row small"><span class="pill swap">교</span> 교체 <span class="pill cover">보</span> 보강·변경${level() >= 1 ? ' <span class="muted">· 칸을 누르면 바꿀 수 있는 시간을 찾습니다.</span>' : ''}</div></div>

      ${NEIS_OK ? `<div class="panel"><h3>오늘 급식 <span class="small muted">${C.fmtDate(date)}</span></h3>${meal ? `<p>${meal.dishes.map(esc).join(' · ')}</p><p class="small muted">${esc(meal.cal || '')}</p>` : `<p class="muted">${neis.weeks['m|' + C.mondayOf(date)] ? '급식 정보가 없습니다.' : '불러오는 중…'}</p>`}</div>` : ''}
      <div class="panel"><div class="row spread"><h3>변동사항</h3><div class="row noprint"><button class="btn sm" data-act="copyday">변동사항 복사</button><button class="btn sm" data-act="copydaytsv">시간표 복사(시트 붙여넣기용)</button>${FREE ? '<button class="btn sm" data-act="print">인쇄</button>' : ''}</div></div>
      ${memo ? `<p>${esc(memo).replace(/\n/g, '<br>')}</p>` : ''}
      ${ch.length ? `<ul class="plain">${ch.map(c => `<li><span>${esc(C.describeChange(c))}</span></li>`).join('')}</ul>` : (memo ? '' : '<p class="muted">이 날짜에는 변동사항이 없습니다.</p>')}
      ${ui.admin ? `<label class="f noprint">행사·안내 메모<textarea id="memo" data-ch="memo" style="min-height:60px" placeholder="예: 해내보카 대회(1학년, 동백관, 13:00~13:30)">${esc(memo)}</textarea></label>
      <div class="row noprint"><label class="f">학사일정 이름<input type="text" id="dlabel" value="${esc(info ? info.label || '' : '')}" placeholder="예: 개교기념일, 2차 지필평가"></label><label class="f">이 날 수업<select id="dkind">${[['n', '정상 수업'], ['0', '휴업일(수업 없음)'], ...[1, 2, 3, 4, 5, 6].map(k => [String(k), `단축 수업(${k}교시까지)`])].map(([v, l]) => opt(v, l, info && info.periods != null ? String(info.periods) : 'n')).join('')}</select></label><button class="btn" data-act="saveday" style="align-self:flex-end">학사일정 저장</button></div>` : ''}</div>`;

  const dayTsv = date => { const st = state(); const out = [['교시', ...data.classes].join('\t')]; for (let p = 0; p < st.nPeriods(date); p++) out.push([p + 1, ...data.classes.map(c => { const l = st.get(date, c, p); return l ? q(`${l.mark === '교' ? '(교)' : l.mark === '시' ? '(고사)' : l.mark ? '(보)' : ''}${l.s}\n${l.t}`) : ''; })].join('\t')); return out.join('\n'); };
  const baseTsv = () => { const out = [['요일', '교시', ...data.classes].join('\t')]; data.periods.forEach((n, d) => { for (let p = 0; p < n; p++) out.push([p ? '' : C.DAYS[d], p + 1, ...data.classes.map(c => { const l = data.base[c][d][p]; return l ? q(`${l.s}\n${l.t}`) : ''; })].join('\t')); }); return out.join('\n'); };

  /* ── 학급별·교사별 (주간) ── */
  const weekHead = ds => `<tr><th class="side">교시</th>${ds.map(d => `<th class="${d === today() ? 'now' : ''}">${C.fmtDate(d)}${calInfo(d) && calInfo(d).label ? `<br><span class="small">${esc(calInfo(d).label)}</span>` : ''}</th>`).join('')}</tr>`;

      <div class="scroll"><table class="tt${ui.find ? ' finding' : ''}"><thead>${weekHead(ds)}</thead><tbody>${rows}</tbody></table></div><p class="small muted">교체·보강이 반영된 주간 시간표입니다.</p>`;
  }
  function vTeacher() {

      <div class="row small"><span class="pill gray">${esc(data.depts[t] || '')}</span><span>기본 주당 <b class="num">${hrs ? hrs.total : 0}</b>시간 · 이번 주 <b class="num">${wk}</b>시간</span></div>
      <div class="scroll"><table class="tt"><thead>${weekHead(ds)}</thead><tbody>${rows}</tbody></table></div>`;

  /* ── 전체(기본) 시간표 ── */
  function baseTable(base, o = {}) {
    let rows = '';
    data.periods.forEach((n, d) => { for (let p = 0; p < n; p++) rows += `<tr class="${p ? '' : 'gap'}"><td class="side">${C.DAYS[d]}${p + 1}</td>${data.classes.map((c, i) => { const k = `${d}|${p}|${c}`; const cl = [gcls(c, i), o.chk?.clash.has(k) || o.chk?.room.has(k) ? 'clash' : '', o.chk?.dup.has(k) ? 'dup' : '', o.moved?.has(k) ? 'moved' : '', o.pick && o.pick.cls === c && o.pick.d === d && o.pick.p === p ? 'pick' : ''].join(' '); return cell(base[c][d][p], o.act ? `data-act="${o.act}" data-cls="${c}" data-d="${d}" data-p="${p}"` : '', cl + (base[c][d][p] ? '' : ' slot')); }).join('')}</tr>`; });
    return `<div class="scroll"><table class="tt${ui.find ? ' finding' : ''}"><thead>${classHead().replace('교시', '요일·교시')}</thead><tbody>${rows}</tbody></table></div>`;
  }
  function vAll() {
    const chk = C.checkBase(data), pk = ui.pick, pl = pk && data.base[pk.cls][pk.d][pk.p];
    const hard = chk.list.filter(x => /동시/.test(x)), soft = chk.list.filter(x => !/동시/.test(x));

      <div class="row small"><span class="pill ${hard.length ? 'bad' : 'ok'}">같은 시간 중복 ${hard.length}건</span><span class="pill ${soft.length ? 'swap' : 'ok'}">하루 중복 ${soft.length}건</span><span class="muted">빨간 테두리: 한 교사가 같은 시간에 두 학급 · 주황 테두리: 한 학급이 같은 과목을 하루에 여러 번</span></div>

      ${ui.admin ? `<div class="note info noprint">${pk ? `선택: <b>${C.DAYS[pk.d]} ${pk.p + 1}교시 ${pk.cls} ${esc(C.lessonText(pl))}</b> — 같은 학급의 다른 칸을 누르면 두 수업의 자리를 바꿉니다. <button class="btn sm" data-act="editbase">과목·교사 수정</button> <button class="btn sm" data-act="unpick">선택 해제</button>` : '관리 모드: 칸을 누른 뒤 같은 학급의 다른 칸을 누르면 기본 시간표에서 두 수업의 자리가 바뀝니다.'}</div>` : ''}

  }

  /* ── 교사 시수 ── */
  function vHours() {
    const h = C.teacherHours(data), ts = C.allTeachers(data).sort((a, b) => (data.depts[a] || '').localeCompare(data.depts[b] || '', 'ko') || a.localeCompare(b, 'ko'));
    const tot = ts.reduce((s, t) => s + h[t].total, 0); let prev = '';
    return `<div class="row spread"><h2>교사 시수</h2><span class="small muted">교사 ${ts.length}명 · 주당 합계 <b class="num">${tot}</b>시간</span></div>
      <div class="scroll"><table class="list"><thead><tr><th>교과</th><th>교사</th>${C.DAYS.map(d => `<th class="r">${d}</th>`).join('')}<th class="r">합계</th><th>담당 과목</th></tr></thead><tbody>
      ${ts.map(t => { const d = data.depts[t] || ''; const first = d !== prev; prev = d; return `<tr><td>${first ? `<b>${esc(d)}</b>` : ''}</td><td><a href="#teacher" data-act="goteacher" data-t="${esc(t)}">${esc(t)}</a></td>${h[t].days.map(n => `<td class="r">${n || ''}</td>`).join('')}<td class="r"><b>${h[t].total}</b></td><td class="small">${Object.entries(h[t].subj).map(([s, n]) => `${esc(s)} ${n}`).join(' · ')}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  }

  /* ── 통계 ── */
  const byDept = (a, b) => (data.depts[a] || '').localeCompare(data.depts[b] || '', 'ko') || a.localeCompare(b, 'ko');
  function vStats() {
    const d0 = C.fromYmd(today()), s = (ui.st ||= { from: C.toYmd(new Date(d0.getFullYear(), d0.getMonth(), 1)), to: C.toYmd(new Date(d0.getFullYear(), d0.getMonth() + 1, 0)) });
    const r = C.stats(data, state(), s.from, s.to), ts = Object.keys(r).sort(byDept), sum = k => ts.reduce((n, t) => n + r[t][k], 0); let prev = '';
    return `<div class="row spread"><h2>통계</h2><div class="row noprint"><input type="date" id="stfrom" data-ch="stfrom" value="${s.from}" aria-label="시작일"> ~ <input type="date" id="stto" data-ch="stto" value="${s.to}" aria-label="종료일"><button class="btn sm" data-act="copystats">표 복사</button></div></div>
      <p class="small muted">예정은 기본 시간표대로 했을 때의 시수, 실제는 교체·보강을 반영한 시수입니다. 휴업일과 단축 수업으로 빠진 시간은 양쪽 모두에서 뺍니다.</p>
      <div class="scroll"><table class="list"><thead><tr><th>교과</th><th>교사</th><th class="r">예정</th><th class="r">실제</th><th class="r">차이</th><th class="r">교체</th><th class="r">보강 들어감</th><th class="r">보강 받음</th><th class="r">고사 감독</th></tr></thead><tbody>
      ${ts.map(t => { const x = r[t], d = data.depts[t] || '', first = d !== prev, df = x.actual - x.plan; prev = d; return `<tr><td>${first ? `<b>${esc(d)}</b>` : ''}</td><td>${esc(t)}</td><td class="r">${x.plan}</td><td class="r"><b>${x.actual}</b></td><td class="r">${df ? `<span class="pill ${df > 0 ? 'cover' : 'swap'}">${df > 0 ? '+' : ''}${df}</span>` : ''}</td><td class="r">${x.swap || ''}</td><td class="r">${x.coverIn || ''}</td><td class="r">${x.coverOut || ''}</td><td class="r">${x.proctor || ''}</td></tr>`; }).join('')}
      <tr><td><b>합계</b></td><td></td><td class="r">${sum('plan')}</td><td class="r"><b>${sum('actual')}</b></td><td></td><td class="r"></td><td class="r">${sum('coverIn')}</td><td class="r">${sum('coverOut')}</td><td class="r">${sum('proctor') || ''}</td></tr></tbody></table></div>`;
  }
  const statsTsv = () => { const s = ui.st, r = C.stats(data, state(), s.from, s.to); return [['교과', '교사', '예정', '실제', '교체', '보강 들어감', '보강 받음', '고사 감독'].join('\t'), ...Object.keys(r).sort(byDept).map(t => [data.depts[t] || '', t, r[t].plan, r[t].actual, r[t].swap, r[t].coverIn, r[t].coverOut, r[t].proctor].join('\t'))].join('\n'); };
  /* ── 특별실 ── */
  function vRooms() {

    revert: () => confirmBox('이 기기에서 고친 내용을 모두 버리고 게시된 시간표로 돌아갈까요?', () => { ui.undo.push(JSON.stringify(data)); data = published; local = false; _st = null; persist(); render(); toast('게시된 시간표로 돌아왔습니다.'); }, '되돌리기'),
    importpaste: () => { const txt = $('#paste').value.trim(); if (!txt) return toast('붙여넣은 내용이 없습니다.');
      try { if (txt[0] === '{') { const nd = JSON.parse(txt); if (!nd.base || !nd.classes) throw new Error('data.json 형식이 아닙니다.'); mutate(() => { data = nd; }, '백업 내용을 불러왔습니다.'); } else importData(C.buildData([{ name: '붙여넣기', rows: C.parseTsv(txt) }])); } catch (e) { toast(e.message); } },
  };
  const curCand = () => { const sw = ui.sw; if (!sw.sel) return null; const [date, p] = sw.sel.split('|'); const m = C.mondayOf(sw.date); return C.swapCandidates(data, state(), sw.cls, sw.date, sw.p, C.addDays(m, -7 * sw.range), C.addDays(m, 4 + 7 * sw.range)).find(c => c.date === date && c.p === +p); };
  const chg = {
    exsubj: (v, el) => mutate(() => { const ex = curEx(), d = el.dataset, sl = ex.days[+d.di].slots[+d.p]; if (v.trim()) sl[d.g] = v.trim(); else delete sl[d.g]; }),
    exproc: (v, el) => mutate(() => { const ex = curEx(); ex.proctors = { ...(ex.proctors || {}) }; if (v) ex.proctors[el.dataset.k] = v; else delete ex.proctors[el.dataset.k]; }),
    find: v => { ui.find = v; render(); }, date: v => { if (v) { ui.date = v; render(); } },
    cls: v => { ui.cls = v; render(); }, teacher: v => { ui.teacher = v; render(); },
    swt: v => { const q = v.trim(), names = C.allTeachers(data), hit = names.includes(q) ? [q] : names.filter(x => q && x.includes(q));
      if (hit.length === 1) { ui.sw.teacher = hit[0]; ui.sw.p = null; ui.sw.sel = null; persist(); render(); } else toast(hit.length ? `여러 명이 검색됩니다: ${hit.join(', ')}` : '그 이름의 선생님을 찾지 못했습니다.'); },
    swdate: v => { if (v) { ui.sw.date = v; ui.sw.p = null; ui.sw.sel = null; render(); } }, swcls: v => { ui.sw.cls = v; ui.sw.p = null; ui.sw.sel = null; render(); }, swrange: v => { ui.sw.range = +v; render(); },
    memo: v => mutate(() => { if (v.trim()) data.memos[ui.date] = v.trim(); else delete data.memos[ui.date]; }, '메모를 저장했습니다.'),
    stfrom: v => { if (v) { ui.st.from = v; render(); } }, stto: v => { if (v) { ui.st.to = v; render(); } },
    bmode: v => { ui.b.mode = v; }, offt: v => { ui.b.teacher = v; render(); }, reqcls: v => { ui.b.cls = v; render(); },
    maxtd: v => mutate(() => { data.cfg.maxTeacherDay = Math.max(1, +v || 6); }),
    sc: (v, el) => mutate(() => { const c = data.cfg.subj[el.dataset.s], k = el.dataset.k; c[k] = el.type === 'checkbox' ? el.checked : el.type === 'text' ? v.trim() : Math.max(k === 'maxDay' ? 1 : 0, +v || 0); }),
    reqn: (v, el) => mutate(() => { data.req = reqRows().map(r => ({ ...r })); data.req[+el.dataset.i].n = Math.max(0, +v || 0); }),
    sname: v => mutate(() => { data.name = v.trim(); }, '이름을 저장했습니다.'),
    xfile: async (v, el) => { const f = el.files[0]; if (!f) return; try { importData(C.buildData(await C.readXlsx(await f.arrayBuffer()))); } catch (e) { toast(e.message || '파일을 읽지 못했습니다.'); } },
  };
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) { if (el.tagName === 'A' && el.dataset.act !== 'goteacher') e.preventDefault(); acts[el.dataset.act]?.(el.dataset, el); } else if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el) chg[el.dataset.ch]?.(el.value, el); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('hashchange', route);

  (async () => {
    if (FREE && location.protocol.startsWith('http')) {
      const dj = await detectDataRepo();
      if (dj) data = published = dj; else try { const r = await fetch('data.json', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); if (j && j.base) data = published = j; } } catch (e) { /* 내장 시간표 사용 */ }
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    loadLocal(); loadNeis();
    // 게시하지 않은 수정이 이 기기에 남아 있으면: 수정 권한이 있으면 바로 합쳐서 게시하고, 없으면 버리고 게시된 시간표를 보여 준다
    if (local && ghRepo()) { if (canPub()) autoPublish(); else { data = published; local = false; base = null; persist(); } }
    route();
    if (FREE && location.protocol.startsWith('http')) setInterval(refresh, 60000);
  })();
  window.__tt = { ui, get data() { return data; } };
})();

</script>
</body>
</html>
